name: Starvios AI Bot Cloud

on:
  schedule:
    - cron: '0 20,22 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright groq
          playwright install chromium
          playwright install-deps chromium

      - name: Ejecutar Bot de Inteligencia Artificial
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STARVIOS_SESSION_COOKIE: ${{ secrets.STARVIOS_SESSION_COOKIE }}
        run: |
          python bots.py
