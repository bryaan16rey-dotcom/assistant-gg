name: Starvios chat bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo prueba el borrador sin publicarlo'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: starvios-chat-bot
      cancel-in-progress: false
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      STARVIOS_SESSION_COOKIE: ${{ secrets.STARVIOS_SESSION_COOKIE }}
      CHAT_INPUT_SELECTOR: ${{ secrets.CHAT_INPUT_SELECTOR }}
      CHAT_SEND_SELECTOR: ${{ secrets.CHAT_SEND_SELECTOR }}
      CHAT_MESSAGE_SELECTOR: ${{ secrets.CHAT_MESSAGE_SELECTOR }}
      STREAM_TRANSCRIPT_SELECTOR: ${{ secrets.STREAM_TRANSCRIPT_SELECTOR }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias y Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0 groq==0.31.0
          playwright install --with-deps chromium

      - name: Ejecutar bot
        run: python bots.py

      - name: Subir captura de diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-chat
          path: resultado_chat.png
          if-no-files-found: ignore
          retention-days: 3
